:root{--bg:#F4F5F7;--card:#fff;--ink:#1D2433;--mute:#667085;--line:#E3E6EC;
  --free:#1F9D7A;--freeT:#D5EEE5;--light:#E0A21A;--lightT:#FBEBC2;--busy:#D4503F;--busyT:#F4C9C2;--busyT2:#F8DBD6;
  --acc:#E0268F;--accT:#FFE3F1;--acc2:#E0268F;--tl:92%;--tf:34%;--g1:transparent;--g2:transparent;--glass:#ffffffcc;--tealtx:#0d6b57;--shadow:#1d243312;
  --we1:#e9ebef;--we2:#f1f2f5;--wet:#9aa1ae}
[data-theme=mkt]{
  --bg:#FFF6F1;--card:#fff;--ink:#2A1F2D;--mute:#7A6B76;--line:#F0DDD6;
  --free:#1FA88A;--freeT:#C4EBDF;--light:#F2A91D;--lightT:#FFE3A6;--busy:#E4604A;--busyT:#F7BDB1;--busyT2:#f9d3ca;
  --acc:#E0268F;--accT:#FFE0F0;--acc2:#FF8A3D;--tl:90%;--tf:42%;--g1:#FFD9EC;--g2:#FFE9C7;--glass:#ffffff99;--tealtx:#0d6b57;--shadow:#e0268f14;
  --we1:#e4e1e6;--we2:#eeecf0;--wet:#a29cab;--tl:90%;--tf:42%;--card:#fff;--glass:#ffffff99;
}
[data-theme=claro]{--bg:#FBF6EE;--ink:#1F2430;--mute:#6B7080;--line:#E8DFD0;--acc:#5B3FD6;--accT:#ECE6FF;--acc2:#E4604A;--g1:#E5DBFF;--g2:#C9F1E5;--shadow:#5b3fd60d;--we1:#e6e3e8;--we2:#efedf1;--wet:#a7a2ae}
[data-theme=escuro]{color-scheme:dark;--bg:#16131C;--card:#221E2B;--ink:#F3EEF7;--mute:#A79DB4;--line:#352F42;--freeT:#1d4a40;--lightT:#5a4614;--busyT:#6a2e27;--busyT2:#7a3830;--acc:#FF5CB1;--accT:#40213a;--acc2:#FF9A4D;--tl:24%;--tf:70%;--g1:#3a1d3a;--g2:#1c2f3a;--glass:#221e2bcc;--tealtx:#7be0c6;--shadow:#0006;--we1:#2d2a35;--we2:#26232d;--wet:#6a6577}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4;
  background-image:radial-gradient(circle at 8% -5%,var(--g1) 0,transparent 32%),radial-gradient(circle at 100% 0,var(--g2) 0,transparent 30%);background-attachment:fixed}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.who{display:flex;gap:14px;align-items:flex-start}
.av{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:3px solid var(--card);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;transform:rotate(-6deg);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent);flex:none;position:relative}
h1{font-size:26px;line-height:1.05}
.sub{color:var(--mute);font-size:13.5px;margin-top:3px}
.route{display:inline-flex;gap:6px;align-items:center;background:var(--accT);color:var(--acc);padding:2px 10px;border-radius:99px;font-weight:700;font-size:12px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.btn{padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;background:var(--card);border:1px solid var(--line);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px #0001}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{background:var(--lightT);color:var(--ink);border:1px dashed #E0B73A;padding:10px 14px;border-radius:14px;margin-bottom:14px;font-size:13.5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.dot.f{background:var(--free);animation:pulse 2s infinite}

function weekView(){
  const days=[0,1,2,3,4].map(i=>addD(ws,i));
  const tk=key(new Date());
  const rk=days.map(d=>({d,s:stats(d)}));
  let head='<div></div>'+rk.map((o,i)=>o.s.hol?`<button class="wd off ${key(o.d)===tk?'today':''}" data-a="day" data-k="${key(o.d)}" title="${esc(o.s.hol)}"><b>${DS[o.d.getDay()]} ${pad(o.d.getDate())}</b><span>${hEmo(o.s.hol)} ${hLbl(o.s.hol)}</span></button>`:`<button class="wd ${key(o.d)===tk?'today':''}" data-a="day" data-k="${key(o.d)}" style="background:${bg(o.s.score)};color:${fg(o.s.score)}"><b>${DS[o.d.getDay()]} ${pad(o.d.getDate())}</b><span>${emo(o.s.score)} ${fh(o.s.free)}</span></button>`).join('');
  let rows='';
  for(let i=0;i<N;i++){
    rows+=`<div class="tl">${i%2===0?st(i):''}</div>`;
    rk.forEach((o,c)=>{const v=lvl(o.d,i),tg=tagAt(o.d,i),ev=tg&&!inClosing(o.d)&&!holName(o.d);
      rows+=`<div class="sl l${v} ${holName(o.d)?'off':''} ${ev?'ev':''}" data-a="slot" data-k="${key(o.d)}" data-i="${i}" style="--i:${i+c*2}" title="${st(i)} · ${tg?tg+' · ':''}${LN[v]}"></div>`});
  }
  const sorted=rk.slice().sort((a,b)=>b.s.score-a.s.score);
  const r2=sorted.map((o,i)=>`<div class="rk"><span class="nm">${DS[o.d.getDay()]}</span><div class="tr"><div class="fl" style="width:${Math.max(4,Math.round(o.s.score*100))}%;background:${fg(o.s.score)}"></div></div><span class="v">${o.s.hol?hEmo(o.s.hol):(i===0?'★ ':'')+fh(o.s.free)}</span></div>`).join('');
  const selI=wdi==null?Math.max(0,days.findIndex(d=>key(d)===tk)):wdi;
  const chips=rk.map((o,i)=>o.s.hol?`<button class="wd off ${i===selI?'sel':''}" data-a="wsel" data-i="${i}"><b>${DS[o.d.getDay()]} ${pad(o.d.getDate())}</b><span>${hEmo(o.s.hol)}</span></button>`:`<button class="wd ${i===selI?'sel':''}" data-a="wsel" data-i="${i}" style="background:${bg(o.s.score)};color:${fg(o.s.score)}"><b>${DS[o.d.getDay()]} ${pad(o.d.getDate())}</b><span>${inClosing(o.d)?ic('lock',13):emo(o.s.score)}</span></button>`).join('');
  const sd=rk[selI],sdd=sd.d;let segs='';
  if(sd.s.hol)segs=`<div class="dseg"><div class="t">dia todo</div><div class="b l2 off">${esc(sd.s.hol)}</div></div>`;
  else{let i=0;while(i<N){const v=lvl(sdd,i),tg=tagAt(sdd,i)||'';let j=i+1;while(j<N&&lvl(sdd,j)===v&&(tagAt(sdd,j)||'')===tg)j++;
    segs+=`<button class="dseg" data-a="day" data-k="${key(sdd)}"><div class="t">${st(i)}–${stE(j)}</div><div class="b l${v}" style="min-height:${Math.max(38,(j-i)*17)}px">${tg?esc(tg):LN[v]}</div></button>`;i=j}}
  const mob=`<div class="wmob"><div class="dch">${chips}</div><div class="dhd"><b>${DL[sdd.getDay()]}, ${dm(sdd)}</b> <span class="sub">${sd.s.hol?esc(sd.s.hol):mood(sd.s.score)+' · '+fh(sd.s.free)+' livres'}</span></div>${segs}<div class="sub" style="text-align:center;margin-top:8px">deslize pro lado para trocar de dia</div></div>`;
  const a=days[0],b=days[4];
  return `<div class="row"><div class="card grow"><div class="nav"><button class="btn" data-a="prev">‹</button><h2 class="disp">${dm(a)} – ${dm(b)}</h2><button class="btn" data-a="next">›</button><button class="btn" data-a="today">Esta semana</button></div>
  <div class="wgrid">${head}${rows}</div>${mob}${legend(false)}</div>
  <div class="card side"><h3 class="disp" style="font-size:18px">Ranking da semana</h3><div class="sub" style="margin-bottom:8px">Horas livres por dia</div>${r2}
  <div class="best" style="margin:14px 0 0">Melhor dia pra conversar<b>${DL[sorted[0].d.getDay()]}, ${dm(sorted[0].d)}</b>${mood(sorted[0].s.score)} · ${fh(sorted[0].s.free)} livres</div></div></div>`;
}

function toast(t,face){const e=document.createElement('div');e.className='ts';if(face){const f=document.createElement('i');f.className='fc '+face;f.style.cssText='width:26px;height:26px;margin-right:8px';e.appendChild(f)}e.appendChild(document.createTextNode(t));e.style.display='flex';e.style.alignItems='center';document.getElementById('toast').appendChild(e);setTimeout(()=>e.remove(),3500)}
function closeM(){document.getElementById('modal').innerHTML=''}

/* ---------- modal do dia ---------- */
function dayModal(k){
  const d=pk(k),s=stats(d);if(!s)return;
  const evs=S.events.filter(e=>e.date===k);
  const recs0=(s.hol?'<div class="banner" style="margin:0 0 10px">'+hEmo(s.hol)+' '+(isFolga(s.hol)?esc(s.hol):'Feriado: '+esc(s.hol))+' — sem expediente.</div>':'')+(inClosing(d)?'<div class="banner" style="margin:0 0 10px">'+ic('lock',14)+' Período de fechamento do mês — sem conversas nesses dias.</div>':''); const banners=recs0;
  const items=S.rec.filter(r=>!s.hol&&r.days.includes(d.getDay())&&!(r.skip&&r.skip.includes(k))).map(r=>({s:r.s,e:r.e,h:`<div class="evi"><i class="l${r.lvl}" style="width:14px;height:14px;display:inline-block;border-radius:4px"></i><span><b>${st(r.s)}–${r.e===N?'18:00':st(r.e)}</b> ${esc(r.title)} <span style="color:var(--mute)">(fixo)</span></span></div>`}))
   .concat(evs.map(e=>({s:e.s,e:e.e,h:`<div class="evi"><i class="l${e.lvl}" style="width:14px;height:14px;display:inline-block;border-radius:4px"></i><span><b>${st(e.s)}–${e.e===N?'18:00':st(e.e)}</b> ${e.title.replace(/</g,'&lt;')}</span>${edit?`<button class="x" data-a="delev" data-id="${e.id}" data-k="${k}">✕</button>`:''}</div>`})))
   .concat(LIVE.filter(x=>x.date===k).map(x=>({s:x.s,e:x.e,h:`<div class="evi"><i class="l${x.status==='ok'?2:1}" style="width:14px;height:14px;display:inline-block;border-radius:4px"></i><span><b>${st(x.s)}–${stE(x.e)}</b> ${x.status==='ok'?'Conversa com ':'Pedido de '}${esc(x.nome)}${x.assunto?' · '+esc(x.assunto):''}${x.status==='ok'?'':' <span style="color:var(--mute)">(aguardando)</span>'}</span></div>`})))
   .sort((a,b)=>a.s-b.s||a.e-b.e).map(x=>x.h).join('');
  const strip=Array.from({length:N},(_,i)=>`<div class="l${lvl(d,i)}" title="${st(i)}"></div>`).join('');
  const opt=(sel)=>Array.from({length:N+1},(_,i)=>`<option value="${i}" ${i===sel?'selected':''}>${i===N?'18:00':st(i)}</option>`).join('');
  document.getElementById('modal').innerHTML=`<div class="ov" data-a="closeM"><div class="md">
  <h3 class="disp">${emo(s.score)} ${DL[d.getDay()]}, ${dm(d)}</h3>
  <div class="chips"><div class="chip" style="background:${bg(s.score)};color:${fg(s.score)}"><b>${mood(s.score)}</b></div><div class="chip"><b>${fh(s.free)}</b>livres</div><div class="chip"><b>${fh(s.b/2)}</b>ocupadas</div></div>
  <div class="strip">${strip}</div><div class="strip-l"><span>08h</span><span>10h</span><span>12h</span><span>14h</span><span>16h</span><span>18h</span></div>
  ${banners}${items||(banners?'':'<div class="sub">Nenhum compromisso neste dia.</div>')}
  ${edit?`<div class="form"><input class="full" id="f-t" placeholder="Compromisso (ex.: Treinamento MKT)"><select id="f-s">${opt(2)}</select><select id="f-e">${opt(4)}</select>
   <select id="f-l" class="full"><option value="2">Ocupada</option><option value="1">Parcial (dá pra encaixar)</option></select>
   <button class="btn pri full" data-a="addev" data-k="${k}">Adicionar compromisso</button></div>`:''}
  <div style="text-align:right;margin-top:14px"><button class="btn" data-a="closeM">Fechar</button></div></div></div>`;
}


/* ---------- balãozinho do horário ---------- */
let peekT=null;
function closePeek(){clearTimeout(peekT);document.querySelectorAll('.pop').forEach(p=>p.remove())}
function kindAt(d,i){
  if(holName(d))return isFolga(holName(d))?holName(d):'Feriado · sem expediente';
  if(inClosing(d))return 'Fechamento do mês · sem conversas';
  if(recWd(d.getDay(),i,key(d))[0])return 'Horário fixo · se repete';
  const k=key(d);if(S.events.find(e=>e.date===k&&i>=e.s&&i<e.e))return 'Compromisso pontual';
  const lv=liveAt(k,i);if(lv)return lv.status==='ok'?'Conversa marcada':'Pedido aguardando confirmação';
  return S.week[d.getDay()][i]?'Bloco fixo da rotina':'';
}
function showPeek(t){
  const i=+t.dataset.i;let get,head,kind;
  if(t.dataset.k){
    const d=pk(t.dataset.k);get=x=>({lv:lvl(d,x),tag:tagAt(d,x)});head=DL[d.getDay()]+', '+dm(d);kind=x=>kindAt(d,x);
  }else{
    const wd=+t.dataset.wd;get=x=>{const rc=recWd(wd,x)[0];return {lv:Math.max(S.week[wd][x],rc?rc.lvl:0),tag:rc?rc.title:null}};
    head=DL[wd]+' (toda semana)';kind=x=>recWd(wd,x)[0]?'Horário fixo · se repete':(S.week[wd][x]?'Bloco fixo da rotina':'');
  }
  const sig=x=>{const g=get(x);return g.lv+'|'+(g.tag||'')};
  const k0=sig(i);let a=i,b=i;
  while(a>0&&sig(a-1)===k0)a--;while(b<N-1&&sig(b+1)===k0)b++;
  const g=get(i),end=b+1===N?'18:00':st(b+1);
  const title=g.tag||(g.lv===0?'Livre — pode me chamar':g.lv===1?'Parcialmente ocupada':'Ocupada');
  const col=g.lv===0?'var(--free)':g.lv===1?'var(--light)':'var(--busy)';
  const kd=kind(i);
  closePeek();
  const p=document.createElement('div');p.className='pop';p.style.setProperty('--c',col);
  p.innerHTML=`<b>${esc(title)}</b><div>${head}</div><div class="pt">${ic('clock',13)} ${st(a)}–${end}</div>${kd?`<div class="pk">${kd}</div>`:''}`;
  document.body.appendChild(p);
  const r=t.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  let x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),y=r.top-h-8;if(y<8)y=r.bottom+8;
  p.style.left=x+'px';p.style.top=y+'px';
  peekT=setTimeout(closePeek,6000);
}
window.addEventListener('scroll',closePeek,{passive:true});

/* ---------- eventos ---------- */
document.addEventListener('click',async ev=>{
  if(!ev.target.closest('.pop'))closePeek();
  const t=ev.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='closeM'&&t.classList.contains('ov')&&ev.target!==t)return;
  if(a==='tab'){view=t.dataset.v;animNext=true}
  else if(a==='prev'){view==='mes'?cm.setMonth(cm.getMonth()-1):ws=addD(ws,-7);wdi=null;animNext=true}
  else if(a==='next'){view==='mes'?cm.setMonth(cm.getMonth()+1):ws=addD(ws,7);wdi=null;animNext=true}
  else if(a==='today'){cm=new Date();cm.setDate(1);ws=mondayOf(new Date());animNext=true}
  else if(a==='edit'){edit=!edit}
  else if(a==='theme'){const o=['pro','mkt','claro','escuro'];theme=o[(o.indexOf(theme)+1)%4];applyTheme();try{localStorage.setItem('agenda-tema',theme)}catch(e){}}
  else if(a==='brush'){brush=+t.dataset.v}
  else if(a==='dur'){durM=+t.dataset.m}
  else if(a==='slot'){if(edit&&t.classList.contains('hm'))return;showPeek(t);return}
  else if(a==='day'){dayModal(t.dataset.k);return}
  else if(a==='closeM'){closeM();return}
  else if(a==='delrec'){S.rec=S.rec.filter(r=>r.id!==t.dataset.id);dirty=true}
  else if(a==='addrec'){
    const rs=+document.getElementById('r-s').value,re=+document.getElementById('r-e').value;
    const days=[...document.querySelectorAll('.r-d')].filter(x=>x.checked).map(x=>+x.value);
    const title=document.getElementById('r-t').value.trim()||'Horário fixo';
    if(re<=rs){toast('O fim precisa ser depois do início');return}
    if(!days.length){toast('Escolha pelo menos um dia');return}
    S.rec.push({id:'r'+Date.now(),title,s:rs,e:re,days,lvl:2});dirty=true;
  }
  else if(a==='delev'){S.events=S.events.filter(e=>e.id!==t.dataset.id);dirty=true;render();dayModal(t.dataset.k);return}
  else if(a==='addev'){
    const s=+document.getElementById('f-s').value,e=+document.getElementById('f-e').value;
    const title=document.getElementById('f-t').value.trim()||'Compromisso';
    if(e<=s){toast('O fim precisa ser depois do início');return}
    S.events.push({id:'e'+Date.now(),date:t.dataset.k,s,e,title,lvl:+document.getElementById('f-l').value});
    dirty=true;render();dayModal(t.dataset.k);return;
  }
  else if(a==='copyDo'){
    const txt=summaryText();
    try{await navigator.clipboard.writeText(txt);toast('Copiado!')}
    catch(e){
      const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('Copiado!')}catch(e2){toast('Não consegui copiar, selecione o texto manualmente')}
      ta.remove();
    }
    return;
  }
  else if(a==='wsel'){wdi=+t.dataset.i}
  else if(a==='incl'){CHG=null;view='mar';animNext=true}
  else if(a==='alt'){
    if(!PED.length){toast('Ainda não há horários marcados pra alterar');return}
    view='mar';animNext=true;render();
    setTimeout(()=>{const e=document.getElementById('reqs');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},60);return;
  }
  else if(a==='chgreq'){CHG=t.dataset.id;toast('Escolha o novo horário na lista acima');window.scrollTo({top:0,behavior:'smooth'});return}
  else if(a==='pick'){bookModal(t.dataset.k,+t.dataset.s,+t.dataset.e);return}
  else if(a==='sendreq'){
    const k=t.dataset.k,need=+t.dataset.dur,s0=+document.getElementById('bk-s').value,nome=document.getElementById('bk-n').value,as=document.getElementById('bk-a').value.trim().slice(0,80);
    const quem=WEB?(document.getElementById('bk-q').value.trim().slice(0,60)):'';
    if(nome!=='Marketing'&&nome!=='Logística'){toast('Escolha Marketing ou Logística');return}
    if(WEB&&!quem){toast('Informe seu nome');return}
    const d=pk(k);for(let i=s0;i<s0+need;i++)if(lvl(d,i)!==0){toast('Esse horário acabou de ser ocupado. Escolha outro.');closeM();render();return}
    try{localStorage.setItem('agenda-area',nome)}catch(e){}
    if(WEB){
      const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      TOK[id]=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);try{localStorage.setItem('agenda-tok',JSON.stringify(TOK));localStorage.setItem('agenda-quem',quem)}catch(e){}
      const rec={id,date:k,s:s0,e:s0+need,nome,assunto:as,uid:null,quem,criado:Date.now(),st0:'pendente'};
      const oldId=CHG,oldRec=oldId&&PED.find(x=>x.id===oldId);CHG=null;
      LOCP[id]={t:Date.now(),rec};if(oldId)LOCP[oldId]={t:Date.now(),del:1};PED.push(rec);if(oldId)PED=PED.filter(x=>x.id!==oldId);mergeLive();closeM();render();toast('Pedido enviado! A Mirelli vai confirmar','kiss');
      (async()=>{try{
        await dbR.doc('pedidos/'+id).set({date:k,s:s0,e:s0+need,nome,assunto:as,quem,uid:null,criado:rec.criado,tok:TOK[id]});
        if(oldId)try{await dbR.doc('pedidos/'+oldId).delete()}catch(e){}
      }catch(e){delete LOCP[id];if(oldId)delete LOCP[oldId];PED=PED.filter(x=>x.id!==id);if(oldRec)PED.push(oldRec);mergeLive();render();toast('Não consegui enviar: '+((e&&e.message)||e)+'. Tente de novo.')}})();
      return;
    }
    try{
      const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      if(WEB){TOK[id]=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);try{localStorage.setItem('agenda-tok',JSON.stringify(TOK));localStorage.setItem('agenda-quem',quem)}catch(e){}}
      await dbR.doc('pedidos/'+id).set({date:k,s:s0,e:s0+need,nome,assunto:as,quem,uid:myUid||null,criado:Date.now(),tok:WEB?TOK[id]:undefined});
      if(CHG){const old=CHG;CHG=null;try{await dbR.doc('pedidos/'+old).delete()}catch(e){}if(isOwner)try{await dbR.doc('decisoes/'+old).delete()}catch(e){}}
      toast('Pedido enviado! A Mirelli vai confirmar','kiss');closeM();render();
    }catch(e){toast(WEB?'Não consegui enviar: '+((e&&e.message)||e):'Não consegui enviar. Copie a mensagem e mande direto pra ela.')}
    return;
  }
  else if(a==='appr'||a==='deny'||a==='pend'){
    const stt=a==='appr'?'ok':a==='deny'?'no':'pendente';
    const o=PED.find(x=>x.id===t.dataset.id);if(!o)return;
    const prev=o.st0,msg=a==='appr'?'Horário confirmado':a==='deny'?'Pedido recusado':'Voltou para aguardando';
    if(WEB){LOCP[o.id]={t:Date.now(),st:stt};o.st0=stt;mergeLive();render();toast(msg,a==='appr'?'ok':null)}
    try{
      await dbR.doc('pedidos/'+o.id).set({date:o.date,s:o.s,e:o.e,nome:o.nome,assunto:o.assunto,uid:o.uid||null,quem:o.quem||'',criado:o.criado||0,status:stt,decidido:Date.now()});
      if(!WEB)toast(msg,a==='appr'?'ok':null);
    }catch(e){if(WEB){delete LOCP[o.id];o.st0=prev;mergeLive();render()}toast('Não consegui salvar a resposta')}
    return;
  }
  else if(a==='dona'){if(ownerUI()){view='ped';animNext=true}else{loginModal();return}}
  else if(a==='dologin'){
    const v=(document.getElementById('pw')||{}).value||'';
    if(WEB){let ok=false;try{const rr=await api({action:'auth',senha:v});ok=!!(rr&&rr.ok)}catch(e){toast('Sem conexão com o servidor');return}
      if(!ok){toast('Senha incorreta');return}
      SENHA=v;unlocked=true;try{sessionStorage.setItem('agenda-senha',v)}catch(e){}closeM();view='ped';animNext=true;toast('Bem-vinda, Mirelli','kiss')}
    else if(sha256('agenda-mirelli|'+v)===PW_HASH){unlocked=true;try{sessionStorage.setItem('agenda-dona','1')}catch(e){}closeM();view='ped';animNext=true;toast('Bem-vinda, Mirelli','kiss')}
    else{toast('Senha incorreta');return}
  }
  else if(a==='logout'){unlocked=false;SENHA='';try{sessionStorage.removeItem('agenda-senha')}catch(e){}try{sessionStorage.removeItem('agenda-dona')}catch(e){}if(view==='ped')view='mes';animNext=true}
  else if(a==='cancelreq'){
    const cid=t.dataset.id,bak=PED.find(x=>x.id===cid);
    if(WEB){LOCP[cid]={t:Date.now(),del:1};PED=PED.filter(x=>x.id!==cid);mergeLive();render();toast('Cancelado')}
    try{await dbR.doc('pedidos/'+cid).delete();if(isOwner)try{await dbR.doc('decisoes/'+cid).delete()}catch(e){};if(!WEB)toast('Cancelado')}
    catch(e){delete LOCP[cid];if(WEB&&bak){PED.push(bak);mergeLive();render()}toast('Não consegui cancelar')}
    return;
  }
  else if(a==='save'){await save();return}
  render();
});
document.addEventListener('change',e=>{if(e.target.id==='cl-n'){const n=Math.max(0,Math.min(10,Math.round(+e.target.value||0)));S.closing.n=n;S.closing.on=n>0;dirty=true;render()}});
function paintAt(el){
  if(!edit||!el||!el.classList||!el.classList.contains('hm'))return;
  const d=+el.dataset.wd,i=+el.dataset.i;
  if(S.week[d][i]===brush)return;
  S.week[d][i]=brush;const rc=recWd(d,i)[0];el.className='hm l'+Math.max(brush,rc?rc.lvl:0)+(rc?' ev':'');dirty=true;
}
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('.wmob')){tx=e.touches[0].clientX;ty=e.touches[0].clientY}else tx=0},{passive:true});
document.addEventListener('touchend',e=>{
  if(!tx||!e.target.closest||!e.target.closest('.wmob'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=0;
  if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;
  const days=[0,1,2,3,4].map(i=>addD(ws,i));const cur=wdi==null?Math.max(0,days.findIndex(d=>key(d)===key(new Date()))):wdi;
  const nx=cur+(dx<0?1:-1);
  if(nx<0){ws=addD(ws,-7);wdi=4}else if(nx>4){ws=addD(ws,7);wdi=0}else wdi=nx;
  animNext=true;render();
},{passive:true});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.hm');if(el&&edit){painting=true;paintAt(el);e.preventDefault()}});
document.addEventListener('pointermove',e=>{if(painting)paintAt(document.elementFromPoint(e.clientX,e.clientY))});
document.addEventListener('pointerup',()=>{if(painting){painting=false;render()}});

async function save(){
  try{
    const art=window.claude&&await window.claude.use('artifact');
    if(!art){toast('Publicação indisponível nesta visualização');return}
    S.sample=false;
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';c.querySelector('#app').className='';
    c.removeAttribute('data-theme');c.querySelector('#modal').innerHTML='';c.querySelector('#toast').innerHTML='';
    c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
    const r=await art.publish('<!DOCTYPE html>\n'+c.outerHTML);
    if(r&&r.conflict){toast('Alguém publicou antes — recarregando a versão mais nova');return}
    dirty=false;toast('Publicado! O time já vê a versão atualizada');render();
  }catch(e){toast('Só a dona da agenda pode publicar ('+((e&&e.message)||e)+')')}
}
render();
(async function initLive(){
  try{
    if(WEB){dbR=webDb;canWrite=true;isOwner=false;if(SENHA)unlocked=true;pollWeb();setInterval(pollWeb,15000);return}
    const c=window.claude;if(!c||!c.use)return;
    dbR=await c.use('db');if(!dbR)return;
    const u=await c.use('user');usrR=u;
    isOwner=!!(u&&u.isOwner&&u.isOwner());
    canWrite=u&&u.can?u.can('data.write'):null;
    try{myUid=u&&u.id?await u.id():null}catch(e){}
    const after=()=>{mergeLive();resolveNames();if(!painting)render()};
    dbR.collection('pedidos').onSnapshot(sn=>{PED=sn.docs.map(d=>cleanPed(d.id,d.data())).filter(Boolean);after()},()=>{});
    dbR.collection('decisoes').onSnapshot(sn=>{DEC={};sn.docs.forEach(d=>{const x=d.data();if(x&&(x.status==='ok'||x.status==='no'))DEC[d.id]={status:x.status}});after()},()=>{});
    render();
  }catch(e){}
})();
setInterval(()=>{if(!painting&&!document.querySelector('.ov'))render()},60000);
})();
</script>
